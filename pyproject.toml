[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chestx-robust"
version = "0.1.0"
description = "Reproducible multi-label chest X-ray experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.11,<2.12",
  "torchvision>=0.26,<0.27",
  "numpy>=2.5,<2.6",
  "pandas>=3.0,<3.1",
  "Pillow>=10",
  "scikit-learn>=1.9,<2",
  "PyYAML>=6",
  "tqdm>=4.66",
  "matplotlib>=3.10,<4",
  "psutil>=7,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
