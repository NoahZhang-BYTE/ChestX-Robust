seed: 42
device: auto
output_dir: outputs/B4_densenet121_scheduler

data:
  csv_path: data/labels.csv
  image_root: data/raw/images
  image_col: path
  label_cols: []
  image_size: 224
  val_split: 0.2
  batch_size: 32
  num_workers: 0
  prefetch_factor: null
  persistent_workers: false

model:
  name: densenet121
  pretrained: true

training:
  epochs: 20
  learning_rate: 0.0003
  weight_decay: 0.0001
  threshold: 0.5
  amp: true
  scheduler: reduce_on_plateau
  scheduler_monitor: macro_auprc
  scheduler_factor: 0.5
  scheduler_patience: 2
  early_stopping_patience: 4
  early_stopping_min_delta: 0.0001
