seed: 42
device: auto
output_dir: checkpoints/imagenet_pretrained

data:
  csv_path: data/labels.csv
  image_root: data/raw/images
  image_col: path
  # Leave empty to select the canonical NIH ChestX-ray14 labels.
  label_cols: []
  image_size: 224
  val_split: 0.2
  batch_size: 16
  num_workers: 0

model:
  name: resnet18
  pretrained: true

training:
  epochs: 10
  learning_rate: 0.0003
  weight_decay: 0.0001
  threshold: 0.5
