seed: 42
device: auto
output_dir: checkpoints/densenet121_bs32

data:
  csv_path: data/labels.csv
  image_root: data/raw/images
  image_col: path
  # Leave empty to select the canonical NIH ChestX-ray14 labels.
  label_cols: []
  image_size: 224
  val_split: 0.2
  batch_size: 32
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true

model:
  name: densenet121
  pretrained: true

training:
  epochs: 20
  learning_rate: 0.0001
  weight_decay: 0.0001
  threshold: 0.5
  amp: true
